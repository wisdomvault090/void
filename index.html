<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A collection of interactive mini-games, experiments, and challenges.">
  <title>VOID — Challenge Your Mind</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Spline 3D Viewer -->
  
</head>

<body>

  <nav class="dots" id="dots" aria-label="Sections"></nav>

  <header class="hero" id="top">
    <canvas id="fx" aria-hidden="true"></canvas>

    <div class="wrap" id="wrap">

      <!-- NEW 3D SPLINE ROBOT -->
     <div id="robot">
  <canvas id="robotCanvas"></canvas>
</div>
      <h1 aria-label="VOID">
        <span class="ch">V</span><span class="ch">O</span><span class="ch">I</span><span class="ch">D</span>
      </h1>

      <p class="sub">Challenge Your Mind.</p>

      <p class="tiny">
        A collection of interactive mini-games, experiments, and challenges.
      </p>

      <button class="glass cta" id="cta" type="button">
        PLAY MINI GAMES
      </button>

    </div>
  </header>

  <main id="feed"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>

  <script src="main.js"></script>
  <script src="animations.js"></script>

</body>
</html>
