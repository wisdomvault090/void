<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <meta
    name="description"
    content="A collection of interactive mini-games, experiments, and challenges."
  >

  <title>VOID — Challenge Your Mind</title>


  <!-- ======================================================
       FONT
       ====================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- ======================================================
       YOUR CSS
       ====================================================== -->

  <link rel="stylesheet" href="style.css">


  <!-- ======================================================
       THREE.JS
       MUST LOAD BEFORE animations.js
       ====================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
  </script>

</head>


<body>


  <!-- ======================================================
       SIDE NAV DOTS
       ====================================================== -->

  <nav
    class="dots"
    id="dots"
    aria-label="Sections">
  </nav>


  <!-- ======================================================
       HERO
       ====================================================== -->

  <header
    class="hero"
    id="top"
  >

    <!-- Background particle canvas -->
    <canvas
      id="fx"
      aria-hidden="true">
    </canvas>


    <div
      class="wrap"
      id="wrap"
    >


      <!-- ==================================================
           3D ROBOT
           Three.js renders inside this canvas
           ================================================== -->

      <div id="robot">

        <canvas
          id="robotCanvas">
        </canvas>

      </div>


      <!-- ==================================================
           VOID TITLE
           ================================================== -->

      <h1 aria-label="VOID">

        <span class="ch">V</span>
        <span class="ch">O</span>
        <span class="ch">I</span>
        <span class="ch">D</span>

      </h1>


      <!-- ==================================================
           SUBTITLE
           ================================================== -->

      <p class="sub">
        Challenge Your Mind.
      </p>


      <!-- ==================================================
           DESCRIPTION
           ================================================== -->

      <p class="tiny">
        A collection of interactive mini-games,
        experiments, and challenges.
      </p>


      <!-- ==================================================
           CTA
           ================================================== -->

      <button
        class="glass cta"
        id="cta"
        type="button"
      >
        PLAY MINI GAMES
      </button>


    </div>

  </header>


  <!-- ======================================================
       GAME FEED
       main.js generates the games here
       ====================================================== -->

  <main id="feed"></main>


  <!-- ======================================================
       GSAP
       ====================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
  </script>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js">
  </script>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js">
  </script>


  <!-- ======================================================
       YOUR JAVASCRIPT
       IMPORTANT ORDER:
       main.js FIRST
       animations.js SECOND
       ====================================================== -->

  <script src="main.js"></script>

  <script src="animations.js"></script>


</body>
</html>
