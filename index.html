<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A collection of interactive mini-games, experiments, and challenges.">
  <title>VOID — Challenge Your Mind</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="dots" id="dots" aria-label="Sections"></nav>

  <header class="hero" id="top">
    <canvas id="fx" aria-hidden="true"></canvas>

    <div class="wrap" id="wrap">
      <svg id="robot" viewBox="0 0 400 480" aria-hidden="true">
        <defs>
          <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3c3c3c"/>
            <stop offset=".5" stop-color="#141414"/>
            <stop offset="1" stop-color="#040404"/>
          </linearGradient>
          <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#262626"/>
            <stop offset="1" stop-color="#050505"/>
          </linearGradient>
          <radialGradient id="rim" cx=".3" cy=".15" r=".8">
            <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <filter id="gl" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="6"/>
          </filter>
        </defs>

        <g id="all">
          <g id="body">
            <path d="M30 480C30 398 88 360 150 346H250C312 360 370 398 370 480Z" fill="url(#m2)" stroke="rgba(255,255,255,.14)"/>
            <path d="M60 480C62 420 100 388 150 376M340 480C338 420 300 388 250 376" fill="none" stroke="rgba(255,255,255,.1)"/>
            <rect x="172" y="286" width="56" height="70" rx="14" fill="#0a0a0a" stroke="rgba(255,255,255,.12)"/>
            <path d="M180 300v40M200 300v40M220 300v40" stroke="rgba(255,255,255,.07)"/>
            <g id="chest">
              <circle cx="200" cy="424" r="16" fill="#0070f3" filter="url(#gl)"/>
              <circle cx="200" cy="424" r="6" fill="#8ec2ff"/>
              <circle cx="200" cy="424" r="22" fill="none" stroke="rgba(255,255,255,.14)"/>
            </g>
          </g>

          <g id="head">
            <rect x="104" y="170" width="18" height="58" rx="9" fill="#101010" stroke="rgba(255,255,255,.16)"/>
            <rect x="278" y="170" width="18" height="58" rx="9" fill="#101010" stroke="rgba(255,255,255,.16)"/>
            <rect x="118" y="88" width="164" height="214" rx="76" fill="url(#m)" stroke="rgba(255,255,255,.18)"/>
            <rect x="118" y="88" width="164" height="214" rx="76" fill="url(#rim)"/>
            <path d="M150 112Q200 92 250 112" fill="none" stroke="rgba(255,255,255,.3)" stroke-linecap="round"/>
            <rect x="136" y="158" width="128" height="70" rx="35" fill="#000" stroke="rgba(255,255,255,.16)"/>
            <g id="eyes">
              <circle cx="176" cy="193" r="10" fill="#0070f3" filter="url(#gl)"/>
              <circle cx="224" cy="193" r="10" fill="#0070f3" filter="url(#gl)"/>
              <circle cx="176" cy="193" r="5.5" fill="#9fcbff"/>
              <circle cx="224" cy="193" r="5.5" fill="#9fcbff"/>
            </g>
            <path d="M172 262h56M180 273h40" stroke="rgba(255,255,255,.16)" stroke-linecap="round"/>
          </g>
        </g>
      </svg>

      <h1 aria-label="VOID">
        <span class="ch">V</span><span class="ch">O</span><span class="ch">I</span><span class="ch">D</span>
      </h1>
      <p class="sub">Challenge Your Mind.</p>
      <p class="tiny">A collection of interactive mini-games, experiments, and challenges.</p>
      <button class="glass cta" id="cta" type="button">PLAY MINI GAMES</button>
    </div>
  </header>

  <main id="feed"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
  <script src="games.js"></script>
  <script src="main.js"></script>
<script src="animations.js"></script>
  <script type="module" src="firebase.js"></script>
</body>
</html>
